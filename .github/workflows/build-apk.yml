name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - 'package.json'
      - 'eas.json'

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      build_id: ${{ steps.build-info.outputs.build_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build APK
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait

      - name: Get build ID
        id: build-info
        run: |
          sleep 10
          eas build:list --platform android --limit 1 --json > build-info.json
          BUILD_ID=$(jq -r '.[0].id // "unknown"' build-info.json)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
          echo "Dashboard: https://expo.dev/accounts/mojo093/projects/Elic/builds"

      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ## Android APK Build Started

            **Build Profile**: `${{ github.event.inputs.profile || 'preview' }}`
            **Build ID**: `${{ steps.build-info.outputs.build_id }}`

            **Check build status**: [EAS Dashboard](https://expo.dev/accounts/mojo093/projects/Elic/builds)

            Once the build completes (~10-20 minutes), the APK will be uploaded to:
            [Google Drive Folder](https://drive.google.com/drive/folders/1_733nt1TTmaK9fqcgd-cGJRLJuieBpj5)

  upload-to-drive:
    name: Upload to Google Drive
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build completion
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          echo "Waiting for build ID: $BUILD_ID"
          for i in {1..60}; do
            BUILD_STATUS=$(eas build:view --id "$BUILD_ID" --json | jq -r '.status')
            echo "Attempt $i/60 — status: $BUILD_STATUS"

            if [ "$BUILD_STATUS" == "FINISHED" ]; then
              echo "Build completed successfully."
              break
            elif [ "$BUILD_STATUS" == "ERRORED" ] || [ "$BUILD_STATUS" == "CANCELED" ]; then
              echo "Build failed with status: $BUILD_STATUS"
              exit 1
            fi

            if [ "$i" == "60" ]; then
              echo "Timed out waiting for build."
              exit 1
            fi

            sleep 60
          done

      - name: Download APK
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          BUILD_URL=$(eas build:view --id "$BUILD_ID" --json | jq -r '.artifacts.buildUrl')

          if [ "$BUILD_URL" == "null" ] || [ -z "$BUILD_URL" ]; then
            echo "Build URL not available for build $BUILD_ID"
            exit 1
          fi

          echo "Downloading from: $BUILD_URL"
          wget -O "ELIC-${BUILD_ID}.apk" "$BUILD_URL"
          echo "build_id=$BUILD_ID" >> $GITHUB_ENV

      - name: Upload to Google Drive
        env:
          MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
        run: |
          python3 <<'PYEOF'
          import urllib.request, os, json, sys

          apk_file = [f for f in os.listdir('.') if f.endswith('.apk')][0]
          folder_id = "1_733nt1TTmaK9fqcgd-cGJRLJuieBpj5"

          print(f"Uploading {apk_file}...")

          with open(apk_file, 'rb') as f:
              apk_content = f.read()

          file_metadata = {
              'name': os.path.basename(apk_file),
              'parents': [folder_id]
          }

          boundary = '-------314159265358979323846'
          body = (
              f'--{boundary}\r\n'
              f'Content-Type: application/json; charset=UTF-8\r\n\r\n'
              f'{json.dumps(file_metadata)}\r\n'
              f'--{boundary}\r\n'
              f'Content-Type: application/vnd.android.package-archive\r\n\r\n'
          ).encode() + apk_content + f'\r\n--{boundary}--'.encode()

          req = urllib.request.Request(
              'https://gateway.maton.ai/google-drive/upload/drive/v3/files?uploadType=multipart',
              data=body,
              method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ["MATON_API_KEY"]}')
          req.add_header('Content-Type', f'multipart/related; boundary={boundary}')

          try:
              response = urllib.request.urlopen(req)
              result = json.load(response)
              file_id = result['id']

              permission = {'type': 'anyone', 'role': 'reader'}
              perm_data = json.dumps(permission).encode()
              perm_req = urllib.request.Request(
                  f'https://gateway.maton.ai/google-drive/drive/v3/files/{file_id}/permissions',
                  data=perm_data,
                  method='POST'
              )
              perm_req.add_header('Authorization', f'Bearer {os.environ["MATON_API_KEY"]}')
              perm_req.add_header('Content-Type', 'application/json')
              urllib.request.urlopen(perm_req)

              print(f"Upload successful.")
              print(f"File ID: {file_id}")
              print(f"Download: https://drive.google.com/uc?export=download&id={file_id}")

          except Exception as e:
              print(f"Upload failed: {e}")
              sys.exit(1)
          PYEOF

      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ## APK Build and Upload Complete

            **APK File**: `ELIC-${{ env.build_id }}.apk`
            **Status**: Successfully uploaded to Google Drive

            **Download APK**: [Google Drive Folder](https://drive.google.com/drive/folders/1_733nt1TTmaK9fqcgd-cGJRLJuieBpj5)
